[custom]
;不要随意改变关键字，否则会导致出错
;acl4SSR规则-在线版

;去广告：不支持
;自动测速：支持，18个地区按名称分组，每300秒检测，50ms切换容差
;信息条目和明确限速/应急节点不参与地区优选，仍可手动选择
;OpenClash通过regional_urltest.rb设置lazy=false，使未选中地区也定时检测
;节点容错：支持，按SG新加坡、JP日本、HK香港、TW台湾、US美国顺序兜底，每300秒检查一次
;微软分流：支持
;苹果分流：支持
;增强中国IP段：不支持
;增强国外GFW：不支持

