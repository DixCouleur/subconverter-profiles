# Supplement /etc/config/smartdns; do not forward back to dnsmasq or OpenClash.
ca-file /etc/ssl/certs/ca-certificates.crt
cache-mem-size 1048576
serve-expired-ttl 3600
serve-expired-reply-ttl 3
cache-checkpoint-time 86400
# These local script endpoints must not wait for unreachable address probes.
domain-rules /local.adguard.org/ -speed-check-mode none
domain-rules /local.adguard.com/ -speed-check-mode none
domain-rules /injections.adguard.org/ -speed-check-mode none
